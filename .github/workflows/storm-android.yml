name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Asegurar herramientas del sistema y Conan 1.x
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake python3-pip
          pip install "conan<2"

      - name: Descargar e instalar NDK directamente
        run: |
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          echo "Descomprimiendo NDK..."
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c $HOME/ndk

      - name: Limpiar dependencias y remotos muertos
        run: |
          # Comentar cualquier intento de añadir remotos en CMakeLists.txt para evitar el error de URL
          sed -i 's/conan_add_remote/#conan_add_remote/g' CMakeLists.txt
          
          # Limpiar TODAS las dependencias del servidor storm en conanfile.py
          cat << 'EOF' > fix_conan.py
          import re
          with open('conanfile.py', 'r') as f:
              data = f.read()
          # Elimina cualquier texto como "directx/...@storm" o "fmod/...@storm"
          data = re.sub(r'["\'][^"\']*@storm/prebuilt["\']\s*,?\s*', '', data)
          with open('conanfile.py', 'w') as f:
              f.write(data)
          EOF
          python3 fix_conan.py

      - name: Configurar CMake para Android
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar ejecutable
        run: cmake --build build
