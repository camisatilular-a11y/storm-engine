name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Asegurar herramientas del sistema y Conan 1.x
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake python3-pip
          pip install "conan<2"

      - name: Descargar e instalar NDK directamente
        run: |
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          echo "Descomprimiendo NDK..."
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c $HOME/ndk

      - name: Quitar servidor remoto muerto de Conan
        run: sed -i '/storm.jfrog.io/d' CMakeLists.txt

      - name: Quitar dependencia de DirectX de forma segura
        run: |
          cat << 'EOF' > fix_conan.py
          import re
          with open('conanfile.py', 'r') as f:
              data = f.read()
          # Elimina la dependencia sin romper los corchetes
          data = re.sub(r',\s*["\']directx/9\.0@storm/prebuilt["\']', '', data)
          data = re.sub(r'["\']directx/9\.0@storm/prebuilt["\']\s*,?\s*', '', data)
          with open('conanfile.py', 'w') as f:
              f.write(data)
          EOF
          python3 fix_conan.py

      - name: Configurar CMake para Android
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar ejecutable
        run: cmake --build build
