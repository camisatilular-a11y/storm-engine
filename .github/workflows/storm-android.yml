name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  ANDROID_NDK_HOME: /home/runner/ndk
  NDK_HOME: /home/runner/ndk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias limpias y Conan 1.x
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake python3-pip
          pip install "conan<2"

      - name: Descargar e instalar NDK directamente
        run: |
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c $HOME/ndk

      - name: Forzar perfil de Conan para Android
        run: |
          conan profile new default --detect --force
          conan profile update settings.os=Android default
          conan profile update settings.os.api_level=21 default
          conan profile update settings.arch=armv7 default
          conan profile update settings.compiler=clang default
          conan profile update settings.compiler.libcxx=libc++ default
          conan profile update env.CONAN_CMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake default

      - name: Investigar y purgar opciones incompatibles de SDL
        run: |
          echo "=== RESULTADOS DEL RASTREO DE 'nas' ==="
          grep -Rni "nas" . || true
          echo "======================================="
          
          cat << 'EOF' > fix_build.py
          import os, re
          
          # Palabras clave de opciones de PC que rompen la compilación en Android
          bad_options = ['nas', 'alsa', 'pulse', 'jack', 'x11', 'wayland', 'xcursor', 'mir']
          bad_patterns = [re.compile(r'\b' + opt + r'\b') for opt in bad_options]
          
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if '.git' in root or file == 'fix_build.py': continue
                  filepath = os.path.join(root, file)
                  try:
                      with open(filepath, 'r', encoding='utf-8') as f:
                          lines = f.readlines()
                      
                      new_lines = []
                      changed = False
                      for line in lines:
                          lower_line = line.lower()
                          
                          # 1. Borrar linea entera si contiene 'sdl' y una opcion prohibida
                          if 'sdl' in lower_line and any(p.search(lower_line) for p in bad_patterns):
                              print(f"Borrando linea en {filepath}: {line.strip()}")
                              changed = True
                              continue
                              
                          # 2. Borrar configuraciones obsoletas de storm
                          if 'conan_add_remote' in lower_line or '@storm/prebuilt' in lower_line:
                              changed = True
                              continue
                              
                          new_lines.append(line)
                      
                      if changed:
                          with open(filepath, 'w', encoding='utf-8') as f:
                              f.writelines(new_lines)
                  except Exception:
                      pass
          EOF
          python3 fix_build.py

      - name: Configurar CMake para Android
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar ejecutable
        run: cmake --build build
