name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Asegurar herramientas del sistema y Conan 1.x
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake python3-pip libegl-dev libegl1-mesa-dev
          pip install "conan<2"

      - name: Descargar e instalar NDK directamente
        run: |
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          echo "Descomprimiendo NDK..."
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c $HOME/ndk

      - name: Limpiar dependencias y remotos muertos
        run: |
          cat << 'EOF' > fix_build.py
          import re
          
          # 1. Borrar el bloque multilínea completo de conan_add_remote en CMakeLists.txt
          with open('CMakeLists.txt', 'r') as f:
              cmake_data = f.read()
          cmake_data = re.sub(r'conan_add_remote\s*\([^)]+\)', '', cmake_data)
          with open('CMakeLists.txt', 'w') as f:
              f.write(cmake_data)
              
          # 2. Limpiar las dependencias huérfanas del servidor storm en conanfile.py
          with open('conanfile.py', 'r') as f:
              conan_data = f.read()
          conan_data = re.sub(r'["\'][^"\']*@storm/prebuilt["\']\s*,?\s*', '', conan_data)
          with open('conanfile.py', 'w') as f:
              f.write(conan_data)
          EOF
          python3 fix_build.py

      - name: Configurar CMake para Android
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar ejecutable
        run: cmake --build build
