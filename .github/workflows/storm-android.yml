- name: Saneamiento total del motor para Android
        run: |
          cat << 'EOF' > patch.py
          import re

          with open("conanfile.py", "r", encoding="utf-8") as f:
              content = f.read()

          # Reemplazar la función requirements completa de forma segura para evitar problemas de indentación
          old_req_def = '''def requirements(self):
    if self.settings.os == "Windows":
        #conan-center
        self.requires("7zip/19.00")
    else:
        #conan-center
        self.requires ("openssl/1.1.1n")#fix for error: 'sentry-crashpad/0.4.13' requires 'openssl/1.
        self.options["sdl"].nas = False #fix for https://github.com/conan-io/conan-center-index/issu
        self.options["libsndfile"].with_mpeg= False #fix for 0a12560440ac9f760670829a1cde44b787f587a
        if self.options.steam:
            self.requires("steamworks/1.5.1@storm/prebuilt")
        if self.options.conan_sdl:
            self.requires("sdl/2.0.18")'''

          new_req_def = '''def requirements(self):
    if self.settings.os == "Windows":
        pass
    else:
        self.requires("openssl/1.1.1n")
        self.options["libsndfile"].with_mpeg = False
        if self.options.steam:
            pass
        if self.options.conan_sdl:
            self.requires("sdl/2.0.18")'''

          content = content.replace(old_req_def, new_req_def)
          content = content.replace('"directx/9.0@storm/prebuilt", "fmod/2.02.05@storm/prebuilt"', '')

          with open("conanfile.py", "w", encoding="utf-8") as f:
              f.write(content)

          with open("CMakeLists.txt", "r", encoding="utf-8") as f:
              cmake_content = f.read()

          cmake_content = re.sub(r'conan_add_remote\s*\([^)]*\)', '', cmake_content, flags=re.DOTALL)

          with open("CMakeLists.txt", "w", encoding="utf-8") as f:
              f.write(cmake_content)

          print("Saneamiento completado con éxito.")
          EOF
          python3 patch.py
