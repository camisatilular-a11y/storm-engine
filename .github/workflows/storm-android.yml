name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  ANDROID_NDK_HOME: /home/runner/ndk
  NDK_HOME: /home/runner/ndk
  CMAKE_MAKE_PROGRAM: /usr/bin/ninja
  CONAN_CONNECT_TIMEOUT: "10"
  CONAN_READ_TIMEOUT: "10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias limpias y Conan 1.x
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip cmake python3-pip ninja-build build-essential
          pip install "conan<2"

      - name: Descargar e instalar NDK directamente
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c $HOME/ndk

      - name: Bloquear auto-configuracion erronea de conan.cmake
        run: sed -i 's/BUILD missing/BUILD missing PROFILE default/g' CMakeLists.txt

      - name: Forzar perfil de Conan para Android
        run: |
          conan profile new default --detect --force
          conan profile update settings.os=Android default
          conan profile update settings.os.api_level=21 default
          conan profile update settings.arch=armv7 default
          conan profile update settings.compiler=clang default
          conan profile update settings.compiler.version=14 default
          conan profile update settings.compiler.libcxx=c++_shared default
          conan profile update env.CONAN_CMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake default
          conan profile update conf.tools.android:ndk_path=$HOME/ndk default
          conan profile update conf.tools.cmake.cmaketoolchain:generator=Ninja default
          conan profile update env.CMAKE_MAKE_PROGRAM=/usr/bin/ninja default

      - name: Reemplazar servidor de GNU congelado por espejo Kernel.org
        run: |
          conan download libiconv/1.17@ --recipe-only || true
          find ~/.conan/data -name "conandata.yml" -exec sed -i 's|https://ftp.gnu.org/gnu/|https://mirrors.kernel.org/gnu/|g' {} + || true

      - name: Configurar y compilar CMake para Android
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/ndk/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja
          cmake --build build --config Release

      - name: Guardar resultado compilado
        uses: actions/upload-artifact@v4
        with:
          name: storm-engine-android
          path: build/
